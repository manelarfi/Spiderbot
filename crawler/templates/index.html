<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Python Web Crawler</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            min-height: 100vh;
        }
        .card {
            animation: fadeIn 1s ease forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .btn-primary {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
        }
        .results-box {
            animation: fadeResults 1s ease;
        }
        @keyframes fadeResults {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="card shadow-lg p-4 rounded-4">
                <h2 class="mb-4 text-center">🕸️ Python Web Crawler</h2>

                <form method="POST" class="mb-4">
                    <div class="mb-3">
                        <label class="form-label">Start URL</label>
                        <input type="url" name="start_url" class="form-control" placeholder="https://example.com" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Max Depth</label>
                        <input type="number" name="max_depth" class="form-control" value="1" min="0" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">🚀 Start Crawling</button>
                </form>

                {% if results %}
                    <div class="mt-4 results-box">
                        <h4>Results:</h4>
                        <pre class="bg-dark text-light p-3 rounded-3" style="height: 400px; overflow:auto;">
{{ results | join('\n') }}
                        </pre>
                    </div>
                {% else %}
                    <div id="loading" class="d-none text-center mt-4">
                        <div class="spinner-border text-primary" role="status">
                          <span class="visually-hidden">Loading...</span>
                        </div>
                        <p class="mt-2">Crawling in progress...</p>
                    </div>
                {% endif %}

            </div>
        </div>
    </div>
</div>

<script>
    const form = document.querySelector('form');
    form?.addEventListener('submit', () => {
        document.getElementById('loading').classList.remove('d-none');
    });
</script>

</body>
</html>
